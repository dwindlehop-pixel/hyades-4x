name: CI

on:
  # Branch pushes are covered by the pull_request trigger. Listening to both
  # `push: ["**"]` and `pull_request` ran the whole matrix twice per PR commit
  # — the concurrency group below cannot dedupe them, because github.ref is
  # refs/heads/<branch> for one and refs/pull/<n>/merge for the other. Pushes
  # to main stay, so post-merge breakage still surfaces.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes an in-flight run and cancels it; the balance sweeps
# are long enough that stacking them up is wasteful.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Build + the whole test suite, engine and viewer (the workspace).
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version && cargo --version
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --all-targets --verbose
      # --all-targets skips doctests; the module docs carry the spec prose, so
      # run them separately rather than letting them rot uncompiled.
      - name: Doctests
        run: cargo test --workspace --doc --verbose

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # lib.rs states the portability contract: no clock, no filesystem, no network,
  # no threads, no OS RNG — which is exactly what makes the engine wasm-targetable.
  # Compiling for wasm32 is the only thing that actually holds that claim honest.
  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - name: cargo check (wasm32-unknown-unknown)
        run: cargo check --lib --target wasm32-unknown-unknown --verbose
      # net/src/web.rs compiles only for wasm32, so the workspace clippy run
      # never sees it.
      - name: clippy, hyades-net for wasm32
        run: cargo clippy -p hyades-net --target wasm32-unknown-unknown -- -D warnings

  # The replay viewer (docs/Hyades_interface.md §8): the site Pages deploys,
  # built and opened. smoke.mjs drives the wasm module headless over every
  # replay in both modes; browser.mjs opens the page in the runner's Chrome
  # and checks the WebGL2 juicy frame against the module's CPU frame.
  viewer:
    name: viewer (wasm + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --no-self-update
          rustup default stable
      - name: wasm-bindgen CLI
        run: web/install-wasm-bindgen.sh
      - name: Build the site
        run: web/build.sh _site --quick
      - name: Module smoke test
        run: node web/test/smoke.mjs _site/hyades_viewer.wasm _site/replays
      - name: Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1 ws@8.18.3
      - name: Browser test
        env:
          HYADES_CHROME_CHANNEL: chrome
        run: node web/test/browser.mjs _site
      - name: Relay match (three tabs through a local relay)
        env:
          HYADES_CHROME_CHANNEL: chrome
        run: node web/test/relay-match.mjs _site

  # The short drivers, run for real so a panic or a NaN-poisoned sweep fails CI.
  examples:
    name: examples (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Build all examples
        run: cargo build --release --examples --verbose
      # `coverage_time` was here and is now offline-only. Two reasons, and the
      # first is the disqualifying one: **its doctrine comparison went vacuous.**
      # It contrasts the default `medium_fleet_size` against a "past the
      # optimum" 6.0, and since T-56 stage 3c decoupled the cost ladder from the
      # capacity ladder that knob is a *price* and no longer a hold — so both
      # beds now print identical coverage (3336/3349 on seeds 1/7). It also
      # takes ~8 minutes post-T-68. A check that costs eight minutes to print a
      # tautology is not a check; see the example's own header.
      - name: Run
        run: |
          for ex in trace montecarlo combat_arena; do
            echo "::group::$ex"
            cargo run --release --example "$ex"
            echo "::endgroup::"
          done

  # The tuned sweeps. Minutes each, so they get their own job rather than
  # holding up the fast feedback above.
  balance:
    name: balance sweeps (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      # tests/balance.rs pins the tuned laser-vs-missile outcome: the golden
      # win table, the per-seed survivor counts, and the design properties
      # MIGRATION.md states. #[ignore]d so a plain `cargo test` stays fast, and
      # --nocapture keeps the human-readable sweep in the log — which is what
      # the laser_vs_missile example used to be here for. It is not run
      # separately any more; the test covers the same ground and asserts.
      - name: Tuned balance (tests/balance.rs)
        run: cargo test --release --test balance -- --ignored --nocapture
      # Moved here from the fast job: at the ratified snowball defaults this runs
      # ~28 full-colonization sims and takes minutes, not seconds.
      - name: coverage_trace
        run: cargo run --release --example coverage_trace
      # min_time_search is deliberately NOT run here. It is an offline job: at the
      # ratified snowball defaults each of its ~270 trials is a full-colonization
      # sim (~9 s locally), so the search is ~40 min on this hardware and longer on
      # a runner — it would spend most of an hour to time out at 60 min. Its cost
      # grew precisely because the economy started working, which is the good
      # outcome, not a regression to defend against here.
      #
      # Run it by hand when tuning:  cargo run --release --example min_time_search
      #
      # CI still covers this ground: coverage_trace above exercises the same
      # engine paths across ~28 sims and fails on a panic, and tests/balance.rs
      # asserts the combat side. What is missing is a *bounded* economy assertion
      # — see R-AC17/R-SIM2 — which is a threshold decision, not a timeout to
      # paper over.
