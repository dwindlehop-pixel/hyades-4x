name: Release

# Cuts one release for the batch of main commits since the last one
# (docs/Hyades_releases.md). The version is assigned by scripts/next_release.sh
# from the launch test's census alone; nothing here takes a version as input.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

# One release at a time; never cancel one half-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Newest green commit of main
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # A skipped run is green, so say why on the run page (annotation and summary).
          say() { echo "$1"; echo "::notice title=Release::$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
                  --status success --limit 1 --json headSha -q '.[0].headSha')
          [ -n "$sha" ] || { say "Nothing to release: no green CI run on main."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          git checkout -q "$sha"
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9][0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]' HEAD 2>/dev/null || true)
          if [ -n "$prev" ] && [ "$(git rev-list -n1 "$prev")" = "$sha" ]; then
            say "Nothing to release: ${sha:0:7}, the newest green commit of main, is already $prev."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "batch: ${prev:-start}..$sha, $(git rev-list --count ${prev:+$prev..}HEAD) commits"
      - name: Toolchain
        if: steps.pick.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Launch test
        if: steps.pick.outputs.skip != 'true'
        run: |
          cargo run --release --example launch_census > "$RUNNER_TEMP/census"
          grep -c '^card ' "$RUNNER_TEMP/census"
          grep -c '^kind ' "$RUNNER_TEMP/census"
      - name: Number, branch and tag
        if: steps.pick.outputs.skip != 'true'
        env:
          PREV: ${{ steps.pick.outputs.prev }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          : > "$RUNNER_TEMP/prev_notes"
          if [ -n "$PREV" ]; then git tag -l --format='%(contents)' "$PREV" > "$RUNNER_TEMP/prev_notes"; fi
          read -r tag branch level < <(scripts/next_release.sh "$PREV" "$RUNNER_TEMP/prev_notes" \
                                        "$RUNNER_TEMP/census" "$RUNNER_TEMP/notes")
          echo "previous: ${PREV:-none}, new: $tag ($level) on $branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A major release starts its own branch at the batch's last commit; a
          # minor or bugfix release fast-forwards its major's branch to it. A
          # release branch only ever receives main, so the forward is always fast.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch -q origin "$branch"
            git checkout -q -B "$branch" "origin/$branch"
            git merge -q --ff-only "$SHA"
          else
            git checkout -q -B "$branch" "$SHA"
          fi
          git tag -a "$tag" -F "$RUNNER_TEMP/notes"
          git push origin "$branch" "$tag"
          msg="Released $tag ($level) on $branch at ${SHA:0:7}; previous ${PREV:-none}."
          echo "::notice title=Release::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
